name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to release (vX.Y.Z)
        required: true
        type: string

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            triple: x86_64-unknown-linux-gnu
          - runner: ubuntu-24.04-arm
            triple: aarch64-unknown-linux-gnu
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      TRIPLE: ${{ matrix.triple }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $TAG" >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      - name: Install toolchain
        run: |
          set -euo pipefail
          if [ -e rust-toolchain ] || [ -e rust-toolchain.toml ]; then
            rustup toolchain install
          else
            rustup toolchain install stable --profile minimal
          fi
      - name: Check tag against package version
        run: |
          set -euo pipefail
          version=$(cargo metadata --format-version 1 --no-deps \
            | jq -r '.packages[] | select(.name == "seenboard") | .version')
          [ -n "$version" ] || { echo "seenboard package not found" >&2; exit 1; }
          [ "$TAG" = "v$version" ] || { echo "Tag $TAG does not match seenboard $version" >&2; exit 1; }
      - name: Build
        run: cargo build --release --locked -p seenboard
      - name: Package
        run: |
          set -euo pipefail
          mkdir dist
          mv target/release/seenboard "dist/seenboard-$TRIPLE"
          (cd dist && sha256sum "seenboard-$TRIPLE" > "seenboard-$TRIPLE.sha256")
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/seenboard-${{ matrix.triple }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bin-${{ matrix.triple }}
          path: dist/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
      REPO: ${{ github.repository }}
    steps:
      - name: Validate tag
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Invalid tag: $TAG" >&2; exit 1; }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: bin-*
          merge-multiple: true
          path: dist
      - name: Verify artifacts
        run: (cd dist && sha256sum -c -- *.sha256)
      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if state=$(gh release view "$TAG" --repo "$REPO" --json isDraft,assets \
            --jq '"\(.isDraft) \(.assets | length)"' 2>/dev/null); then
            read -r draft count <<<"$state"
            if [ "$draft" = true ]; then
              # a draft was never public, so what a failed run left in it gives way to this build
              gh release upload "$TAG" dist/* --repo "$REPO" --clobber
              gh release edit "$TAG" --repo "$REPO" --draft=false
            else
              # a published asset is never replaced: what is already out wins and only the gaps are filled
              mkdir published
              if [ "$count" -gt 0 ]; then
                gh release download "$TAG" --repo "$REPO" --dir published
              fi
              missing=()
              for file in dist/*; do
                name=$(basename "$file")
                if [ -e "published/$name" ]; then
                  cp "published/$name" "$file"
                else
                  bin=${name%.sha256}
                  if [ "$bin" != "$name" ] && [ -e "published/$bin" ]; then
                    # the checksum has to describe the binary that is already out, not this rebuild
                    (cd published && sha256sum "$bin") > "$file"
                  fi
                  missing+=("$file")
                fi
              done
              (cd dist && sha256sum -c -- *.sha256)
              if [ "${#missing[@]}" -gt 0 ]; then
                gh release upload "$TAG" "${missing[@]}" --repo "$REPO"
              fi
            fi
          else
            gh release create "$TAG" dist/* --repo "$REPO" --verify-tag --title "$TAG" --notes ""
          fi
